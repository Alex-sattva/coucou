<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: "What should the Coucou assistant layer look like?"
  Three structurally different variants, switchable with ?variant=A|B|C, the bottom bar, or ← →.
  Main job (decided): talk + give tasks. Placement: undecided, so A is a summoned layer,
  B replaces the island home view, C is an ambient caption strip that could be either.
  Delete this file once a direction is chosen (record the verdict in NOTES or the commit).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Layer Prototype</title>
<style>
:root{
  --desk:#E2E4E8; --ink:#16171B; --muted:#5F646D; --line:#D1D4DA;
  --spr:cubic-bezier(.32,1.22,.42,1); --ease:cubic-bezier(.45,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  /* island palette (always dark: it is the notch) */
  --i-bg:#000; --i-card:#121316; --i-line:#22242A; --i-text:#F2F3F5; --i-dim:#8C919B; --i-faint:#5A5F69;
  --amber:#F5A524; --green:#34D399; --red:#F87171;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--desk:#131417; --ink:#ECEDEF; --muted:#9A9FA8; --line:#32353B} }
:root[data-theme="dark"]{--desk:#131417; --ink:#ECEDEF; --muted:#9A9FA8; --line:#32353B}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;padding-bottom:90px}
button{font:inherit;color:inherit}

.top{max-width:1180px;margin:0 auto;padding:24px 16px 14px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.top .grow{flex:1;min-width:260px}
.top h1{margin:0;font-size:26px;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;line-height:1.45}
.top .tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);margin-right:6px;color:var(--muted)}
.btn{appearance:none;border:0;background:var(--ink);color:var(--desk);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}

.stage-wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.stage-outer{position:relative;width:100%}
.stage{position:absolute;left:0;top:0;width:1120px;height:700px;transform-origin:0 0}
.mac{position:absolute;inset:0;background:#050506;border-radius:28px;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.screen{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;
  background:radial-gradient(1200px 520px at 18% 118%,#22324F 0%,transparent 60%),radial-gradient(900px 500px at 92% -10%,#33224A 0%,transparent 55%),linear-gradient(180deg,#0E1116,#0B0D12)}
.menubar{position:absolute;inset:0 0 auto 0;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;color:rgba(255,255,255,.88);background:rgba(18,18,22,.35)}
.menubar span{margin-right:16px}
.term{position:absolute;left:70px;top:120px;width:560px;height:360px;border-radius:12px;background:rgba(22,23,27,.94);box-shadow:0 24px 50px -18px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.12);font:12px/1.6 var(--mono);color:#B9BEC8;overflow:hidden}
.term .tb{height:32px;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.term .tb i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term pre{margin:0;padding:12px 16px;white-space:pre-wrap}
.editor{position:absolute;right:60px;top:170px;width:400px;height:300px;border-radius:12px;background:rgba(30,31,36,.92);box-shadow:0 24px 50px -18px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.1);font:11.5px/1.7 var(--mono);color:#8B90A0;padding:44px 18px}

/* the notch itself */
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#000;z-index:10;color:var(--i-text);
  transition:width .5s var(--spr),height .5s var(--spr),border-radius .45s var(--spr)}
.notch::before,.notch::after{content:"";position:absolute;top:0;width:14px;height:14px;pointer-events:none}
.notch::before{left:-14px;background:radial-gradient(circle at 0 100%,transparent 13.5px,#000 14px)}
.notch::after{right:-14px;background:radial-gradient(circle at 100% 100%,transparent 13.5px,#000 14px)}
.notch.closing{transition:width .32s var(--ease),height .32s var(--ease),border-radius .3s ease}
.cam{position:absolute;left:50%;top:11px;width:8px;height:8px;border-radius:50%;background:#101216;transform:translateX(-50%);box-shadow:inset 0 0 0 1.5px #16191f}
.fade{transition:opacity .25s ease .18s}
.hidden{opacity:0!important;pointer-events:none!important;transition-delay:0s!important}
canvas.mochi{display:block}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:46px;font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;pointer-events:none;transition:opacity .3s}
kbd{font:600 11px var(--font);padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:var(--i-text)}

/* shared bits */
.shimmer{background:linear-gradient(90deg,var(--i-dim) 0%,#fff 45%,var(--i-dim) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-80% 0}}
.route{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--i-dim);padding:3px 9px 3px 7px;border-radius:999px;background:#17181C;border:1px solid var(--i-line);cursor:pointer;white-space:nowrap}
.route i{width:7px;height:7px;border-radius:50%;background:var(--c,#888)}
.route b{color:var(--i-text);font-weight:600}
.mic{appearance:none;border:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1C1D21;cursor:pointer;color:var(--i-text);flex:none}
.mic.on{background:#fff;color:#000}
.mic svg{width:14px;height:14px}
.wave{display:flex;gap:2px;align-items:center;height:16px}
.wave i{width:2.5px;border-radius:2px;background:currentColor;animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:3px}50%{height:15px}}
.ok{appearance:none;border:0;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:#000}
.no{appearance:none;border:1px solid var(--i-line);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent;color:var(--i-text)}
.diff{font:11.5px var(--mono);color:var(--i-dim)}
.diff .p{color:var(--green)} .diff .m{color:var(--red)}
input.field{appearance:none;border:0;outline:0;background:transparent;color:var(--i-text);font:inherit;width:100%;min-width:0}
input.field::placeholder{color:var(--i-faint)}

/* ---------- Variant A: Spotlight ---------- */
.A-bar{position:absolute;left:0;right:0;top:40px;display:flex;align-items:center;gap:12px;padding:0 16px 0 14px;height:44px}
.A-bar .field{font-size:17px;letter-spacing:-.01em}
.A-heard{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.A-sep{position:absolute;left:16px;right:16px;top:92px;height:1px;background:var(--i-line)}
.A-body{position:absolute;left:0;right:0;top:100px;padding:6px 18px 0 62px;font-size:13.5px;line-height:1.5}
.A-row{display:flex;align-items:center;gap:10px;min-height:28px}
.A-row .dim{color:var(--i-dim)}
.A-steps{margin:2px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--i-faint)}
.A-steps li::before{content:"✓ ";color:var(--i-dim)}
.A-ask{margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#1A1408;border:1px solid #3A2A0A}
.A-ask .q{flex:1;color:#FBD38D}
.A-ask code{font:12px var(--mono);color:#fff}
.A-foot{position:absolute;left:62px;right:18px;bottom:12px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--i-faint)}

/* ---------- Variant B: Conversation ---------- */
.B-head{position:absolute;left:18px;right:18px;top:38px;height:24px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--i-dim)}
.B-left{position:absolute;left:14px;top:72px;width:120px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.B-state{font-size:12px;color:var(--i-dim);text-align:center;line-height:1.35}
.B-thread{position:absolute;left:140px;right:18px;top:68px;bottom:64px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  -webkit-mask:linear-gradient(transparent,#000 28px);mask:linear-gradient(transparent,#000 28px)}
.msg{max-width:82%;font-size:13.5px;line-height:1.45;animation:pop .45s var(--spr)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.msg.me{align-self:flex-end;background:#26282E;padding:8px 12px;border-radius:16px 16px 4px 16px}
.msg.me.live{color:var(--i-dim)}
.msg.bot{align-self:flex-start;padding:2px 0}
.work{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i-dim);margin-top:4px;cursor:pointer}
.work .n{font-size:11px;color:var(--i-faint);border:1px solid var(--i-line);border-radius:999px;padding:1px 7px}
.B-card{margin-top:6px;padding:10px 12px;border-radius:14px;background:var(--i-card);border:1px solid var(--i-line)}
.B-card .acts{display:flex;gap:8px;margin-top:8px}
.B-input{position:absolute;left:140px;right:18px;bottom:16px;height:40px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-radius:999px;background:#141518;border:1px solid var(--i-line);font-size:13.5px}

/* ---------- Variant C: Captions ---------- */
.C-ear{position:absolute;top:0;height:32px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--i-dim)}
.C-ear.l{left:12px}.C-ear.r{right:14px}
.C-caps{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:640px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.cap{max-width:100%;text-align:center;font-size:19px;line-height:1.35;letter-spacing:-.01em;padding:6px 14px;border-radius:12px;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;
  transition:opacity .4s ease,transform .4s var(--spr);pointer-events:auto}
.cap.me{color:#A9AEB8;font-size:15px}
.cap.sm{font-size:13px;color:var(--i-dim);display:flex;gap:10px;align-items:center}
.cap.gone{opacity:0;transform:translateY(-6px)}
.C-type{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:420px;height:36px;border-radius:12px;background:rgba(0,0,0,.85);border:1px solid #2A2C32;display:flex;align-items:center;padding:0 12px;gap:8px;z-index:11;font-size:14px;color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 8px var(--c,#888)}

/* switcher (prototype chrome, not part of the design) */
.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:#FF3D7F;color:#fff;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);z-index:100;font-size:13.5px;font-weight:600;max-width:calc(100vw - 32px)}
.switcher button{appearance:none;border:0;background:rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;flex:none}
.switcher span{padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){ .top h1{font-size:21px} }
</style>
</head>
<body>

<div class="top">
  <div class="grow">
    <h1 id="vTitle">—</h1>
    <p id="vDesc"></p>
    <p style="margin-top:8px"><span class="tag" id="vPlace"></span><span class="tag" id="vSummon"></span></p>
  </div>
  <button class="btn ghost" id="resetBtn">Reset</button>
  <button class="btn ghost" id="blockBtn">▶ Blocked demo</button>
  <button class="btn" id="demoBtn">▶ Play demo</button>
</div>

<div class="stage-wrap"><div class="stage-outer" id="stageOuter"><div class="stage" id="stage">
  <div class="mac"><div class="screen" id="screen">
    <div class="menubar"><div><span></span><b>Ghostty</b><span style="margin-left:16px">Shell</span><span>Edit</span><span>View</span></div><div><span>⌁ 82%</span><span>Tue 6 Oct 14:20</span></div></div>
    <div class="term"><div class="tb"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
<pre>~/code/coucou <span style="color:#7CC7FF">feature/voice-harness</span>
❯ claude
  ✻ Welcome to Claude Code

  &gt; <span id="termLine" style="color:#E9EAEE"></span></pre></div>
    <div class="editor">struct SettingsView: View {<br>&nbsp;&nbsp;@ObservedObject var state: AppState<br>&nbsp;&nbsp;var body: some View {<br>&nbsp;&nbsp;&nbsp;&nbsp;Form { … }<br>&nbsp;&nbsp;}<br>}</div>
    <div id="variantRoot"></div>
  </div></div>
</div></div></div>

<div class="switcher" role="toolbar" aria-label="Prototype variant switcher">
  <button id="prevV" aria-label="Previous variant">←</button>
  <span id="vLabel">A</span>
  <button id="nextV" aria-label="Next variant">→</button>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const NOW=()=>performance.now();
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const MIC='<svg viewBox="0 0 16 16" fill="currentColor"><rect x="5.5" y="1" width="5" height="9" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="7.3" y="12" width="1.4" height="3" rx=".7"/></svg>';
const WAVE='<span class="wave">'+[0,.15,.3,.1,.25].map(d=>`<i style="animation-delay:${d}s"></i>`).join('')+'</span>';

/* ------------ Mochi (simplified canvas renderer, same look as the app) ------------ */
const MOCHIS=new Set();
const TINT={idle:null,listening:'#38BDF8',thinking:'#A78BFA',working:'#6366F1',approval:'#F5A524',blocked:'#F87171',done:'#34D399',speaking:null};
class Mochi{
  constructor(size){ this.c=document.createElement('canvas'); this.c.className='mochi'; this.size=size;
    const d=Math.min(2,devicePixelRatio||1); this.c.width=this.c.height=size*d; this.c.style.width=this.c.style.height=size+'px';
    this.x=this.c.getContext('2d'); this.state='idle'; this.col=[255,255,255]; this.tint=0; this.blinkAt=NOW()+1500; this.open=1; this.hop=0; this.t0=NOW()-Math.random()*4000; MOCHIS.add(this) }
  set(s){ if(s===this.state) return; this.state=s; this.hop=1 }
  draw(n){
    const x=this.x,W=this.c.width,t=(n-this.t0)/1000,s=this.state; x.clearRect(0,0,W,W);
    const target=TINT[s]; if(target){ this.col=this.col.map((v,i)=>lerp(v,hex(target)[i],.08)); this.tint=lerp(this.tint,.85,.08) } else this.tint=lerp(this.tint,0,.08);
    this.hop=Math.max(0,this.hop-.035);
    let sx=1,sy=1,oy=0,tilt=0,lx=0,ly=0;
    if(s==='listening'){ const b=Math.sin(t*3.9)*.035; sy=1+b; sx=1-b*.6; ly=-.15 }
    if(s==='thinking'){ lx=.5; ly=-.45; tilt=-.06 }
    if(s==='working'){ tilt=Math.sin(t*5.2)*.07; oy=-Math.abs(Math.sin(t*5.2))*.05; lx=Math.sin(t*1.3)*.4 }
    if(s==='speaking'){ const c=Math.abs(Math.sin(t*12.5)); sy=1-c*.06; sx=1+c*.05 }
    if(s==='approval'){ oy=-Math.abs(Math.sin(t*5))*.07; ly=.1 }
    if(s==='blocked'){ ly=.35; tilt=.08 }
    if(this.hop>0){ const h=Math.sin(this.hop*Math.PI); sy*=1-h*.18; sx*=1+h*.14 }
    const R=W*.3, rx=R*1.14, ry=R*.88, cx=W/2, cy=W/2+R*.08+oy*R;
    x.save(); x.translate(cx,cy+ry); x.rotate(tilt); x.scale(sx,sy); x.translate(0,-ry);
    const p=new Path2D(); for(let i=0;i<=72;i++){ const a=i/72*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a); const px=rx*Math.sign(ca)*Math.pow(Math.abs(ca),2/2.7), py=ry*Math.sign(sa)*Math.pow(Math.abs(sa),2/2.7); i?p.lineTo(px,py):p.moveTo(px,py) } p.closePath();
    let g=x.createLinearGradient(rx*.7,-ry*.85,-rx*.8,ry*.9); g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,'#DADDE4'); x.fillStyle=g; x.fill(p);
    if(this.tint>.02){ g=x.createLinearGradient(0,ry,0,-ry*.3); g.addColorStop(0,rgba(this.col,.9*this.tint)); g.addColorStop(1,rgba(this.col,0)); x.fillStyle=g; x.fill(p) }
    g=x.createRadialGradient(rx*.34,-ry*.46,0,rx*.34,-ry*.46,R*.42); g.addColorStop(0,'rgba(255,255,255,.6)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fill(p);
    x.save(); x.clip(p); x.fillStyle='rgba(255,120,150,.32)'; for(const d of[-1,1]){ x.beginPath(); x.ellipse(d*rx*.55+lx*R*.15,ry*.22,R*.17,R*.1,0,0,7); x.fill() } x.restore();
    if(n>this.blinkAt){ this.blinkAt=n+2400+Math.random()*2600; this.bs=n }
    const bk=this.bs?clamp((n-this.bs)/180,0,1):1; this.open=bk<1?Math.abs(Math.cos(bk*Math.PI)):1;
    x.fillStyle='#1A1B1F'; x.strokeStyle='#1A1B1F';
    for(const d of[-1,1]){ const ex=d*R*.42+lx*R*.22, ey=-R*.06+ly*R*.22, w=R*.18, h=R*.34;
      if(s==='done'){ x.lineWidth=w*.5; x.lineCap='round'; x.beginPath(); x.arc(ex,ey+h*.15,w*.8,Math.PI*1.12,Math.PI*1.88); x.stroke(); continue }
      const hh=Math.max(h*this.open*(s==='approval'?1.1:1),w*.35); x.beginPath(); x.roundRect(ex-w/2,ey-hh/2,w,hh,Math.min(w/2,hh/2)); x.fill() }
    x.restore();
    if(s==='thinking'){ for(let i=0;i<3;i++){ const ph=((t*2.2-i*.25)%1+1)%1; x.fillStyle=`rgba(255,255,255,${.35+.6*Math.max(0,Math.sin(ph*Math.PI*2))})`; x.beginPath(); x.arc(cx+rx*.7+i*R*.22,cy-ry*1.05-i*R*.12,R*.06+i*R*.015,0,7); x.fill() } }
  }
}
(function loop(){ const n=NOW(); for(const m of MOCHIS){ if(!m.c.isConnected){ if(m.dead) MOCHIS.delete(m); m.dead=true; continue } m.dead=false; m.draw(n) } requestAnimationFrame(loop) })();

/* ------------ shared conversation engine (one task at a time) ------------ */
const DEFAULT_ASK='Add a dark mode toggle to the settings in coucou';
const ROUTES=[
  {re:/coucou|notch|mochi|settings|swift/i, agent:'Claude Code', ws:'coucou', c:'#FF6B5B'},
  {re:/korus|invoice|factur|prisma/i, agent:'OpenCode', ws:'korus', c:'#2DD4A7'},
  {re:/portfolio|site|louisraille/i, agent:'OpenCode', ws:'portfolio', c:'#38BDF8'}
];
function route(text){ return ROUTES.find(r=>r.re.test(text)) || {agent:'Claude Code', ws:'coucou', c:'#FF6B5B'} }
const STEPS=['Reading SettingsView.swift','Reading AppState.swift','Adding appearance setting','Editing SettingsView.swift'];
const st={blockNext:false,error:null,open:false,phase:'idle',heard:'',live:false,route:null,step:'',done:[],reply:'',files:null,decision:null,history:[]};
let V=null, runId=0, approvalResolve=null;
const render=()=>V&&V.render(st);
function set(p){ Object.assign(st,p); render() }
function reset(){ runId++; approvalResolve=null; Object.assign(st,{open:false,phase:'idle',heard:'',live:false,route:null,step:'',done:[],reply:'',files:null,decision:null,history:[]}); $('#termLine').textContent=''; render() }
function decide(ok){ if(approvalResolve){ const r=approvalResolve; approvalResolve=null; r(ok) } }

async function speak(text,id){ // fake push-to-talk: words arrive one at a time
  set({open:true,phase:'listening',heard:'',live:true,route:null,reply:'',done:[],step:'',files:null,decision:null});
  await sleep(500); const words=text.split(' ');
  for(const w of words){ if(id!==runId) return false; set({heard:(st.heard?st.heard+' ':'')+w}); await sleep(170+Math.random()*120) }
  await sleep(450); return id===runId;
}
async function run(text,{voice=false}={}){

  set({phase:'working'});

  if(st.blockNext){ st.blockNext=false;
    set({phase:'blocked',error:'SettingsView.swift:42 — cannot find \'AppearanceMode\' in scope'});
    const go=await new Promise(res=>{ approvalResolve=res; if(V&&V.autoApprove) setTimeout(()=>decide(true),V.autoApprove) });
    if(id!==runId) return;
    if(!go){ set({phase:'speaking',reply:'Stopped. The edits are still there, but the build error isn’t fixed.',files:[['SettingsView.swift',18,2]],error:null}); st.history.push({me:text,bot:st.reply,route:r}); await sleep(2400); if(id===runId) set({phase:'done'}); return }
    set({phase:'working',step:'Fixing the missing type',error:null}); await sleep(1600); if(id!==runId) return; st.done=[...st.done,'Fixed the missing type'] }
  set({phase:'approval',step:'Wants to run the build'});
  const ok=await new Promise(res=>{ approvalResolve=res; if(V&&V.autoApprove) setTimeout(()=>decide(true),V.autoApprove) });
  if(id!==runId) return;
  set({decision:ok?'allowed':'denied'});
  if(ok){ set({phase:'working',step:'Running xcodebuild'}); await sleep(1500); if(id!==runId) return }
  set({phase:'speaking',reply: ok ? 'Done. There’s a new “Appearance” toggle in Settings, and the build passes.' : 'Okay, I didn’t run the build. The edits are in place if you want to check them first.',
       files:[['SettingsView.swift',18,2],['AppState.swift',6,0]]});
  st.history.push({me:text,bot:st.reply,route:r});
  await sleep(2400); if(id!==runId) return; set({phase:'done'});
}

const VARIANTS={D:VariantD,A:VariantA,B:VariantB,C:VariantC}, KEYS=Object.keys(VARIANTS);
function show(k,push=true){ if(!VARIANTS[k]) k='A'; reset(); V=VARIANTS[k]; const root=$('#variantRoot'); root.innerHTML=''; V.mount(root);
  $('#vTitle').textContent=`${k} — ${V.name}`; $('#vDesc').textContent=V.desc; $('#vPlace').textContent=V.place; $('#vSummon').textContent=V.summon;
  $('#vLabel').textContent=`${k} — ${V.name}`; $('#blockBtn').style.display=k==='D'?'':'none'; if(push){ const u=new URL(location); u.searchParams.set('variant',k); history.replaceState(null,'',u) } render() }
function cycle(d){ const i=KEYS.indexOf(V.key); show(KEYS[(i+d+KEYS.length)%KEYS.length]) }
$('#prevV').onclick=()=>cycle(-1); $('#nextV').onclick=()=>cycle(1);
$('#resetBtn').onclick=()=>show(V.key);
document.addEventListener('keydown',e=>{
  const typing=e.target.closest&&e.target.closest('input,textarea,[contenteditable]');
  if(typing) return;
  if(e.key==='ArrowLeft') cycle(-1); else if(e.key==='ArrowRight') cycle(1);
  else if(e.key==='/'){ e.preventDefault(); V.key_slash() }
  else if(e.key==='Escape') reset();
  else if(e.key==='Enter'&&(st.phase==='approval'||st.phase==='blocked')) decide(true);
  else if(e.key==='Alt'&&!e.repeat&&st.phase==='idle'||e.key==='Alt'&&!e.repeat&&st.phase==='done') run(DEFAULT_ASK,{voice:true});
});
